# Public legal pages for https://ytvideoanalysis.studio/privacy and /terms.
#
# nginx serves these two pages straight from disk. They never reach Streamlit,
# so they load without signing in and without JavaScript. Every other path
# still goes to the existing `location /` proxy unchanged. Exact-match
# locations (`location =`) always win over prefix locations such as
# `location /`, so no other route changes.
#
# Install (see the deployment steps in the change summary):
#   1. Copy legal/privacy.html and legal/terms.html to the folder named in
#      `root` below. Keep that folder outside home directories so the nginx
#      worker user can read it.
#   2. Copy this file to /etc/nginx/snippets/legal-pages.conf.
#   3. Add `include /etc/nginx/snippets/legal-pages.conf;` inside the existing
#      `server { listen 443 ssl; server_name ytvideoanalysis.studio; ... }` block.
#   4. Run `sudo nginx -t`, then `sudo systemctl reload nginx`.
#
# There is no add_header here on purpose. A location that sets its own
# add_header drops every add_header inherited from the server block, so
# leaving it out keeps the site's existing response headers on these pages.

location = /privacy {
    root /var/www/ytvideoanalysis-legal;
    try_files /privacy.html =404;
    charset utf-8;
}

location = /terms {
    root /var/www/ytvideoanalysis-legal;
    try_files /terms.html =404;
    charset utf-8;
}
