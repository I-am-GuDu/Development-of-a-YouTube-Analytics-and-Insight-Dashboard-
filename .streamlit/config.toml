[server]
# Optimize memory limits (helpful for massive concurrency on large datasets)
maxUploadSize = 50

# Disable file watching in production to save heavy CPU when 1000 users are connected
fileWatcherType = "none"

# Disable CORS and XSRF protection for load testing efficiency (optional, remove in strict production)
enableCORS = false
enableXsrfProtection = false

[browser]
# Prevent Streamlit from trying to gather usage stats over the network, saving CPU and bandwidth
gatherUsageStats = false

[logger]
# Reduce logging overhead on the server during high traffic
level = "error"
