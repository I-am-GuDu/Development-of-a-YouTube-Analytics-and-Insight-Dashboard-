# =============================================================================
# GitHub Actions Workflow: Keep Streamlit App Awake
# =============================================================================
# Streamlit Community Cloud puts free apps to sleep after 7 days of inactivity.
# This workflow pings the app URL every 2 days to reset that inactivity timer,
# ensuring the app stays awake indefinitely.
#
# Schedule: Every 2 days (well within the 7-day sleep window)
# Retries:  Up to 3 attempts with 30-second delays between failures
# =============================================================================

name: Keep Streamlit App Awake

on:
  schedule:
    # ┌───────────── minute (0-59)
    # │  ┌────────── hour (0-23, UTC)
    # │  │ ┌──────── day of month (1-31)
    # │  │ │ ┌────── month (1-12)
    # │  │ │ │ ┌──── day of week (0-6, Sun=0)
    # │  │ │ │ │
    # Runs at 08:37 UTC every 2 days — safely inside the 7-day sleep window.
    # NOTE: the off-the-hour minute (:37) is deliberate. Thousands of jobs are
    # queued at :00, so GitHub frequently delays — or under heavy load, drops —
    # top-of-hour schedules. An odd minute gets picked up far more reliably.
    - cron: '37 8 */2 * *'

  # Allows you to trigger the workflow manually from the GitHub Actions tab
  # Useful for testing that everything works on the first setup
  workflow_dispatch:

jobs:
  keep-alive:
    name: Ping Streamlit App
    runs-on: ubuntu-latest
    timeout-minutes: 5  # Hard limit so the job never hangs indefinitely

    steps:
      - name: Send keep-alive ping with retries
        env:
          APP_URL: https://tubeinsight.streamlit.app/
        run: |
          MAX_RETRIES=3
          RETRY_DELAY=30  # seconds between retries

          echo "🎯 Target: $APP_URL"
          echo "🔁 Max retries: $MAX_RETRIES"
          echo "⏳ Retry delay: ${RETRY_DELAY}s"
          echo "-------------------------------------------"

          for attempt in $(seq 1 $MAX_RETRIES); do
            echo ""
            echo "📡 Attempt $attempt of $MAX_RETRIES..."

            # -s  : Silent mode (no progress bar)
            # -S  : Show errors even in silent mode
            # -o  : Discard response body
            # -w  : Print HTTP status code
            # --connect-timeout : Max time for connection (seconds)
            # --max-time        : Max total time for the request (seconds)
            # -L  : Follow redirects (Streamlit's auth flow bounces through
            #       share.streamlit.io and back before serving the app)
            # -c/-b cookiejar   : Streamlit's auth redirect chain sets a
            #       session cookie on each hop and expects it back on the
            #       next one. Without a cookie jar, curl drops it and the
            #       redirect chain (app -> share.streamlit.io/-/auth/app ->
            #       app/-/login?payload=... -> app) loops until --max-time,
            #       leaving HTTP_STATUS stuck on the last 303 hop — which
            #       still passes the 200-399 check below, so the job reports
            #       success without ever actually reaching the app.
            # -A  : Browser-like User-Agent so the request registers as a
            #       genuine visit (Streamlit's sleep timer keys off traffic)
            # IMPORTANT: do NOT append "2>&1" here. Merging curl's stderr into
            # the captured value would pollute HTTP_STATUS on a network error
            # (e.g. "000curl: (6)...") and break the numeric check below.
            # On any connection failure curl still prints "000" to stdout.
            HTTP_STATUS=$(curl -s -S -o /dev/null -w "%{http_code}" \
              --connect-timeout 20 \
              --max-time 45 \
              -L \
              -c cookiejar.txt -b cookiejar.txt \
              -A "Mozilla/5.0 (compatible; KeepAliveBot/1.0; +https://github.com)" \
              "$APP_URL") || true

            echo "   HTTP Status: $HTTP_STATUS"

            # Guard: only run numeric comparisons when we got clean digits,
            # so a stray non-numeric value can never crash the step.
            if echo "$HTTP_STATUS" | grep -qE '^[0-9]+$' \
              && [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
              echo ""
              echo "✅ Success! App is awake (HTTP $HTTP_STATUS)"
              echo "🕐 Pinged at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
              exit 0
            else
              echo "   ⚠️  Received HTTP $HTTP_STATUS"
              if [ "$attempt" -lt "$MAX_RETRIES" ]; then
                echo "   ⏳ Waiting ${RETRY_DELAY}s before retry..."
                sleep $RETRY_DELAY
              fi
            fi
          done

          # All retries exhausted
          echo ""
          echo "❌ All $MAX_RETRIES attempts failed."
          echo "   The app may be experiencing issues."
          echo "   Last HTTP status: $HTTP_STATUS"
          exit 1
